[build]
  # Canonical website source lives under website/web_deploy in this repository.
  publish = "website/web_deploy"

  # Netlify serverless feedback intake.
  functions = "website/netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
