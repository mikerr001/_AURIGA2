name: Auriga Website Checks and Netlify Deploy

on:
  push:
    branches: [auriga-arael-1]
    paths:
      - "website/web_deploy/**"
      - "website/netlify/**"
      - "netlify.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/netlify-deploy.yml"
  pull_request:
    branches: [main, auriga-arael-1]
    paths:
      - "website/web_deploy/**"
      - "website/netlify/**"
      - "netlify.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/netlify-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auriga-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate public website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install serverless-function dependencies
        run: npm ci --ignore-scripts
      - name: Check website pages and local links
        run: |
          python3 - <<'PY'
          import json
          import os
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote

          root = "website/web_deploy"
          pages = ["index.html", "locator.html", "camera-connect.html"]
          errors = []

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
                  self.ids = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get("id"):
                      self.ids.add(attrs["id"])
                  for attr in ("href", "src", "poster"):
                      value = attrs.get(attr)
                      if value:
                          self.refs.append(value)

          for page in pages:
              full = os.path.join(root, page)
              if not os.path.isfile(full):
                  errors.append(f"Missing required page: {full}")
                  continue
              parser = PageParser()
              with open(full, encoding="utf-8") as fh:
                  parser.feed(fh.read())
              for ref in parser.refs:
                  parsed = urlparse(ref)
                  if parsed.scheme or parsed.netloc or ref.startswith(("data:", "mailto:", "tel:", "javascript:")):
                      continue
                  target = unquote(parsed.path)
                  if not target:
                      if parsed.fragment and parsed.fragment not in parser.ids and page == "index.html":
                          errors.append(f"{page}: missing in-page target #{parsed.fragment}")
                      continue
                  target_path = os.path.normpath(os.path.join(root, target.lstrip("/")))
                  if not os.path.isfile(target_path):
                      errors.append(f"{page}: local reference does not exist: {ref}")
              print(f"OK: {page} ({len(parser.refs)} local/external references scanned)")

          manifest_path = os.path.join(root, "manifest.json")
          if os.path.isfile(manifest_path):
              with open(manifest_path, encoding="utf-8") as fh:
                  manifest = json.load(fh)
              for icon in manifest.get("icons", []):
                  src = icon.get("src", "")
                  if src and not os.path.isfile(os.path.join(root, src.lstrip("/"))):
                      errors.append(f"manifest.json: icon missing: {src}")
              print("OK: manifest.json parses")
          else:
              errors.append("Missing website manifest.json")

          if errors:
              print("\n".join("::error::" + e for e in errors))
              raise SystemExit(1)
          print("Website smoke checks passed.")
          PY
      - name: Verify Netlify function syntax
        run: node --check website/netlify/functions/submit-feedback.js

  deploy:
    name: Deploy site to Netlify
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install function dependencies
        run: npm ci --ignore-scripts
      - name: Deploy production site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::Netlify deploy skipped: add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets, or use Netlify's Git integration for this branch."
            exit 0
          fi
          npx --yes netlify-cli@latest deploy \
            --dir=website/web_deploy \
            --functions=website/netlify/functions \
            --prod \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN"
