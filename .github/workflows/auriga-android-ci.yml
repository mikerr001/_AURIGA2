name: Auriga Arael Android CI

on:
  push:
    branches: [auriga-arael-1]
  pull_request:
    branches: [main, auriga-arael-1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auriga-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - uses: android-actions/setup-android@v3
        with:
          # `tools` is a retired SDK package and makes sdkmanager exit 1.
          # Install only current SDK packages required by compileSdk 34.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Verify project paths
        run: |
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/build.gradle
          test -f website/web_deploy/index.html
          test -f netlify.toml
          test -f website/netlify/functions/submit-feedback.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Cache YOLOv8n TFLite model
        id: yolo-model-cache
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/yolov8n_float32.tflite
          key: auriga-yolov8n-tflite-fp32-640-v1
      - name: Install YOLO export dependencies
        if: steps.yolo-model-cache.outputs.cache-hit != 'true'
        run: python -m pip install --no-cache-dir 'numpy<2' ultralytics
      - name: Export and stage the on-device YOLO model
        if: steps.yolo-model-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          yolo export model=yolov8n.pt format=tflite imgsz=640
          MODEL_PATH="$(find . -type f -name 'yolov8n_float32.tflite' -print -quit)"
          if [ -z "$MODEL_PATH" ]; then
            echo '::error::Ultralytics export did not produce yolov8n_float32.tflite'
            find . -maxdepth 4 -type f -name '*.tflite' -print
            exit 1
          fi
          cp "$MODEL_PATH" android/app/src/main/assets/yolov8n_float32.tflite
          test -s android/app/src/main/assets/yolov8n_float32.tflite
          echo "YOLO model staged: $(du -h android/app/src/main/assets/yolov8n_float32.tflite | cut -f1)"
      - name: Verify on-device detector model
        run: test -s android/app/src/main/assets/yolov8n_float32.tflite
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Run Navi unit tests
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace testNaviDebugUnitTest
      - name: Run Navi lint
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace lintNaviDebug
      - name: Print all lint errors for diagnosis
        if: always()
        working-directory: android
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          report = "app/build/reports/lint-results-naviDebug.xml"
          if not os.path.exists(report):
              print("Lint XML report not generated.")
              raise SystemExit(0)
          root = ET.parse(report).getroot()
          issues = [issue for issue in root.findall("issue")
                    if issue.attrib.get("severity", "").lower() in ("error", "fatal")]
          print(f"Lint error/fatal issues: {len(issues)}")
          for issue in issues:
              loc = issue.find("location")
              where = ""
              if loc is not None:
                  where = f"{loc.attrib.get('file', '?')}:{loc.attrib.get('line', '?')}: "
              print(f"- {where}{issue.attrib.get('id', 'Unknown')}: {issue.attrib.get('message', '')}")
          PY
      - name: Assemble Navi debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleNaviDebug
      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auriga-arael-navi-debug-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            android/app/build/outputs/apk/navi/debug/*.apk
            android/app/build/reports/**
            android/app/build/test-results/**
